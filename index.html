<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>QCM Pokémon</title>
   
    
</head>
<body>
    <canvas id="reseau"></canvas>
    
    
    

      <main class="pokedex" id="pokedex">

    <!-- PARTIE ROUGE SUPÉRIEURE -->
    <div class="pokedex-haut" id="pokedexHaut">

        <div class="camera"></div>

        <div class="ecran-haut">
            <div class="ecran-contenu">
                <h1>POKÉDEX DE KALOS</h1>
                <p>Bienvenue dans le monde Pokémon !</p>
            </div>
        </div>

        <div class="voyants">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <!-- ÉCRAN CENTRAL -->
    <div class="pokedex-ecran">

        <div class="ecran-bleu">
<section id="ecran-age" class="ecran actif">
    <h2 id="titre-profil">Choisis ton profil</h2>

    <p id="description-profil">
        Cette sélection détermine les niveaux disponibles.
    </p>

    <div class="choix">
        <button type="button" id="profil-mineur"
            onclick="configurerJeu('mineur')">
            Moins de 18 ans
        </button>

        <button type="button" id="profil-majeur"
            onclick="configurerJeu('majeur')">
            18 ans ou plus
        </button>
    </div>
</section>

<section id="ecran-niveau" class="ecran">
    <h2 id="titre-niveau">Choisis ton niveau</h2>

    <p id="texte-niveaux"></p>

    <div id="choix-niveaux" class="choix"></div>

    <button type="button" id="bouton-retour-profil"
        onclick="retourProfil()">
        Retour
    </button>
</section>

             <section id="ecran-niveau" class="ecran">
        <h2 id="titre-niveau">Choisis ton niveau</h2>
        <p id="texte-niveaux"></p>
        <div id="choix-niveaux" class="choix"></div>

        <button type="button" id="bouton-retour-profil"
            onclick="retourProfil()">
            Retour
        </button>
    </section>

            <section id="ecran-quiz" class="ecran">
                <p id="progression"></p>
                <h2 id="questionText">Chargement...</h2>
                <img id="imageQuestion" src="" alt="Illustration">
                <div class="reponses" id="reponses"></div>
                <button type="button" id="monBouton" class="bouton-principal" disabled>
                    Suivant
                </button>
                <p id="message" aria-live="polite"></p>
                <p id="score">Score : 0 / 0</p>
            </section>

            <section id="ecran-resultat" class="ecran">
                <h2>Quiz terminé !</h2>
                <p id="resultatFinal"></p>

                <button type="button" class="bouton-principal" onclick="retourNiveaux()">
                    Choisir un autre niveau
                </button>

                <button type="button" onclick="retourProfil()">
                    Changer de profil
                </button>
            </section>

        </div>

    </div>

    <!-- PARTIE ROUGE INFÉRIEURE -->
    <div class="pokedex-bas" id="pokedexBas">

        <div class="boutons-pokedex">
            <span class="bouton-rond"></span>
            <span class="bouton-petit"></span>
            <span class="bouton-petit"></span>
        </div>

    </div>

</main>
<script src="script.js" defer></script>
    

</body>
</html>
