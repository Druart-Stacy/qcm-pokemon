<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .conteneur {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        #questionText {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333;
        }

        .reponses {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .reponse-btn {
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .reponse-btn:hover {
            background-color: #e9e9e9;
        }

        .reponse-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .reponse-btn.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        #imageQuestion {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        #monBouton {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #monBouton:hover {
            background-color: #45a049;
        }

        #monBouton:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 27px;
        }

        #score {
            margin-top: 10px;
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="conteneur">
        <h2 id="questionText">Chargement de la question...</h2>
        <img id="imageQuestion" src="" alt="Question image">
        <div class="reponses" id="reponses">
            <!-- Les réponses seront injectées ici -->
        </div>
        <button id="monBouton">Suivant</button>
        <p id="message"></p>
        <p id="score">Score : 0 / 0</p>
    </div>

    <script>
       
// ==========================================
// 1. VARIABLES GLOBALES
// ==========================================

let questions = [];
let questionIndex = 0;
let score = 0;
let totalQuestions = 0;
let reponseSelectionnee = null;

// ==========================================
// 2. RÉCUPÉRATION DES ÉLÉMENTS HTML
// ==========================================

const bouton = document.getElementById("monBouton");
const message = document.getElementById("message");
const questionText = document.getElementById("questionText");
const reponsesDiv = document.getElementById("reponses");
const imageQuestion = document.getElementById("imageQuestion");
const scoreElement = document.getElementById("score");

// ==========================================
// 3. CHARGEMENT DU FICHIER JSON
// ==========================================

fetch("pokemon.json")
    .then(response => {
        if (!response.ok) {
            throw new Error("Impossible de charger pokemon.json");
        }

        return response.json();
    })
    .then(data => {
        questions = data;
        totalQuestions = questions.length;

        if (totalQuestions === 0) {
            questionText.textContent = "Aucune question disponible.";
            bouton.disabled = true;
            return;
        }

        afficherQuestion();
    })
    .catch(error => {
        console.error("Erreur :", error);
        questionText.textContent = "Erreur lors du chargement des questions.";
        bouton.disabled = true;
    });

// ==========================================
// 4. AFFICHER UNE QUESTION
// ==========================================

function afficherQuestion() {

    // Vérifier si le quiz est terminé
    if (questionIndex >= questions.length) {

        questionText.textContent = "Quiz terminé !";

        message.textContent = `Votre score final : ${score} / ${totalQuestions}`;

        bouton.textContent = "Recommencer";
        bouton.disabled = false;

        reponsesDiv.innerHTML = "";
        imageQuestion.style.display = "none";

        return;
    }

    const question = questions[questionIndex];

    questionText.textContent = question.question;

    

    message.textContent = "";
    reponseSelectionnee = null;

    // Afficher l'image si elle existe
    if (question.Img) {
        imageQuestion.src = question.img;
        imageQuestion.style.display = "block";
    } else {
        imageQuestion.style.display = "none";
    }

    // Vider les anciennes réponses
    reponsesDiv.innerHTML = "";

    // Récupérer les quatre propositions
    const reponses = [
        question.rep1,
        question.rep2,
        question.rep3,
        question.rep4
    ];

    // Créer les boutons
    reponses.forEach((reponse, index) => {

        if (!reponse) return;

        const btn = document.createElement("button");

        btn.className = "reponse-btn";
        btn.textContent = reponse;

        btn.addEventListener("click", () => {
            verifierReponse(index, question.BonneRep, btn);
        });

        reponsesDiv.appendChild(btn);
    });

    // Configurer le bouton suivant
    bouton.textContent =
        questionIndex < questions.length - 1
            ? "Suivant"
            : "Terminer";

    bouton.disabled = true;
}

// ==========================================
// 5. VÉRIFIER LA BONNE RÉPONSE
// ==========================================

function verifierReponse(index, bonneRep, btn) {

    // Empêcher de répondre plusieurs fois
    if (reponseSelectionnee !== null) return;

    reponseSelectionnee = index;

    const boutons = reponsesDiv.querySelectorAll(".reponse-btn");

    // BonneRep commence à 1 dans le JSON.
    // Les index JavaScript commencent à 0.
    const bonneIndex = Number(bonneRep) - 1;

    if (index === bonneIndex) {

        btn.classList.add("correct");

        score++;

        message.textContent = "Bonne réponse !";
        message.style.color = "#28a745";

    } else {

        btn.classList.add("incorrect");

        message.textContent = "Mauvaise réponse !";
        message.style.color = "#dc3545";

        // Afficher la bonne réponse
        if (boutons[bonneIndex]) {
            boutons[bonneIndex].classList.add("correct");
        }
    }

    // Désactiver toutes les réponses
    boutons.forEach(b => {
        b.disabled = true;
    });

    // Autoriser le passage à la question suivante
    bouton.disabled = false;

    // Actualiser le score
    scoreElement.textContent =
        `Score : ${score} / ${questionIndex + 1}`;
}

// ==========================================
// 6. BOUTON SUIVANT / RECOMMENCER
// ==========================================

bouton.addEventListener("click", function() {

    // Si le quiz est terminé : recommencer
    if (questionIndex >= questions.length) {

        questionIndex = 0;
        score = 0;

        scoreElement.textContent = `Score : 0 / ${totalQuestions}`;

        afficherQuestion();

        return;
    }

    // Passer à la question suivante
    if (reponseSelectionnee !== null) {

        questionIndex++;

        afficherQuestion();
    }
});






        
    </script>
</body>
</html>
